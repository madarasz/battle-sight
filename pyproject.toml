[project]
name = "battlesight"
version = "0.1.0"
description = "Augmented reality overlay for Warhammer 40k: Kill Team. Board corner tracking, rectification, measurement."
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pillow>=10",
    "torch>=2.4",
    "transformers>=4.44",
    "scipy>=1.13",
    "pyside6-essentials>=6.8",
]

[project.scripts]
battlesight = "battlesight.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battlesight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Photo regression tests are slow and need tests/images. Run them with `uv run pytest -m photos`.
# Tests run on all cores (pytest-xdist). `-n 0` runs one process, for one test or a debugger.
# `loadgroup` keeps the photo tests on one worker, so their pipeline cache works.
addopts = "-m 'not photos' -n auto --dist loadgroup"
# conftest.py gives each test file one of core, vision, live, ui (CLAUDE.md "Which tests to run").
markers = [
    "photos: regression tests on real photos in tests/images",
    "core: pure geometry, config, camera parsing; about 1 s",
    "vision: corners, rectify, bases, ident, pipeline, benchmarks",
    "live: LiveSession game core",
    "ui: PySide6 window, offscreen",
]
