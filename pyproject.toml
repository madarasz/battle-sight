[project]
name = "battlesight"
version = "0.1.0"
description = "Augmented reality overlay for Warhammer 40k: Kill Team. Board corner tracking, rectification, measurement."
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pillow>=10",
]

[project.scripts]
battlesight = "battlesight.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battlesight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
