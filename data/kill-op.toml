# Kill Op table. `src/battlesight/score.py` reads this file at start.
#
# Key: starting number of enemy operatives (operatives in the enemy team
# list that are not expendable). Value: the number of dead enemy operatives
# for kill grade 1, 2, 3, 4 and 5. The kill grade is the Kill Op score.
# A side with a higher kill grade than the opponent gets 1 more point.
# A count below the first row uses the first row, above the last row the last row.

[kill_grade]
5 = [1, 2, 3, 4, 5]
6 = [1, 2, 4, 5, 6]
7 = [1, 3, 4, 6, 7]
8 = [2, 3, 5, 6, 8]
9 = [2, 4, 5, 7, 9]
10 = [2, 4, 6, 8, 10]
11 = [2, 4, 7, 9, 11]
12 = [2, 5, 7, 10, 12]
13 = [3, 5, 8, 10, 13]
14 = [3, 6, 8, 11, 14]
