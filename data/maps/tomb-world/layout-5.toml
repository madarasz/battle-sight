# Tomb World layout card 5. Recorded from a photo of the card (skill record-map).
# key = wall label on the card (A = 2 grid, B = 1 grid). opening = true:
# a hexagon marker is next to the wall (breach point on A1 and B2, hatchway
# on the others). An opening sits at the centre between two pillars. On an A
# wall with a middle pillar, opening_at names the half next to the marker.
# Points: at = [col, row] = grid intersection (0..7, 0..6, steps of 0.5),
# or at_mm = [x, y] in board mm (origin top-left board corner).
schema = 1
name = "Layout 5"
terrain = "Tomb World"
source = "layout card 5, photo"

# A walls have a pillar at their middle too, but A2 has none.

pillars = [
    [3, 1], [2, 1], [3, 2], [3, 4], [3, 5], [4, 2], [5, 2],
    [6, 2], [7, 2], [5, 3], [5, 4], [5, 5], [0, 3], [1, 3],
    [2, 3], [6, 3], [2, 5], [0, 5], [1, 5], [4, 5], [6, 5],
    [7, 5],
]
wall_ends = [[1, 1]]

[[wall]]
key = "A1"
from = [1, 1]
to = [3, 1]
opening = true
opening_at = [1.5, 1]   # the half next to the marker

[[wall]]
key = "B3"
from = [3, 1]
to = [3, 2]
opening = true

[[wall]]
key = "A2"
from = [3, 2]
to = [3, 4]
opening = false

[[wall]]
key = "B2"
from = [3, 4]
to = [3, 5]
opening = true

[[wall]]
key = "A3"
from = [3, 2]
to = [5, 2]
opening = true
opening_at = [3.5, 2]   # the half next to the marker

[[wall]]
key = "A3"
from = [5, 2]
to = [7, 2]
opening = true
opening_at = [6.5, 2]   # the half next to the marker

[[wall]]
key = "B1"
from = [5, 2]
to = [5, 3]
opening = false

[[wall]]
key = "B2"
from = [5, 3]
to = [5, 4]
opening = true

[[wall]]
key = "B1"
from = [5, 4]
to = [5, 5]
opening = false

[[wall]]
key = "A4"
from = [0, 3]
to = [2, 3]
opening = true
opening_at = [1.5, 3]   # the half next to the marker

[[wall]]
key = "B4"
from = [5, 3]
to = [6, 3]
opening = false

[[wall]]
key = "A2"
from = [2, 3]
to = [2, 5]
opening = false

[[wall]]
key = "A4"
from = [0, 5]
to = [2, 5]
opening = true
opening_at = [0.5, 5]   # the half next to the marker

[[wall]]
key = "B3"
from = [3, 5]
to = [4, 5]
opening = true

[[wall]]
key = "B4"
from = [4, 5]
to = [5, 5]
opening = false

[[wall]]
key = "A1"
from = [5, 5]
to = [7, 5]
opening = true
opening_at = [5.5, 5]   # the half next to the marker

[[objective]] # touches the left side of C1 at [2, 2] (206 - 40.5 - 20), centre on row 2
at_mm = [145.5, 206.0]

[[objective]] # touches the left side of C5: x = 400 - 20 (marker radius)
at_mm = [380.0, 303.0]

[[objective]]
at = [6, 4]

[[teleporter]]
at = [5.5, 2.5]

[[teleporter]]
at = [0.5, 3.5]

[[zone]] # dark grey
name = "grey"
from = [0, 0]
to = [7, 1]

[[zone]] # dark orange
name = "orange"
from = [0, 5]
to = [7, 6]

# Light terrain C1..C5: footprint of the card symbol, sizes in [terrain] light_mm.
# long = the board axis of the long side (C1, C2). Measured on the card photo, then snapped (skill record-map, "Placement of objects").

[[light]]
key = "C1"
at = [2, 2]
long = "x"

[[light]]
key = "C2"
at = [4, 4]
long = "x"

[[light]]
key = "C3"
at = [5, 1]

[[light]]
key = "C4"
at = [1, 4]

[[light]] # left side on the col 4 line (x = 400), on row 3
key = "C5"
at_mm = [420, 303]
