# Tomb World layout card 4. Recorded from a photo of the card (skill record-map).
# key = wall label on the card (A = 2 grid, B = 1 grid). opening = true:
# a hexagon marker is next to the wall (breach point on A1 and B2, hatchway
# on the others). An opening sits at the centre between two pillars. On an A
# wall with a middle pillar, opening_at names the half next to the marker.
# Points: at = [col, row] = grid intersection (0..7, 0..6, steps of 0.5),
# or at_mm = [x, y] in board mm (origin top-left board corner).
schema = 1
name = "Layout 4"
terrain = "Tomb World"
source = "layout card 4, photo"

# A walls have a pillar at their middle too, but A2 has none.

pillars = [
    [0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [2, 2],
    [0, 3], [1, 3], [2, 3], [5, 3], [6, 3], [7, 3], [5, 4],
    [0, 5], [1, 5], [2, 5], [3, 5], [4, 5], [5, 5],
]
wall_ends = [[3, 3], [4, 3]]

[[wall]]
key = "B3"
from = [0, 1]
to = [1, 1]
opening = true

[[wall]]
key = "B1"
from = [1, 1]
to = [2, 1]
opening = false

[[wall]]
key = "B4"
from = [2, 1]
to = [3, 1]
opening = false

[[wall]]
key = "A3"
from = [3, 1]
to = [5, 1]
opening = true
opening_at = [3.5, 1]   # the half next to the marker

[[wall]]
key = "A4"
from = [2, 1]
to = [2, 3]
opening = true
opening_at = [2, 1.5]   # the half next to the marker

[[wall]]
key = "A2"
from = [5, 1]
to = [5, 3]
opening = false

[[wall]]
key = "A1"
from = [0, 3]
to = [2, 3]
opening = true
opening_at = [0.5, 3]   # the half next to the marker

[[wall]]
key = "B2"
from = [2, 3]
to = [3, 3]
opening = true

[[wall]]
key = "B2"
from = [4, 3]
to = [5, 3]
opening = true

[[wall]]
key = "A3"
from = [5, 3]
to = [7, 3]
opening = true
opening_at = [6.5, 3]   # the half next to the marker

[[wall]]
key = "A2"
from = [2, 3]
to = [2, 5]
opening = false

[[wall]]
key = "A4"
from = [5, 3]
to = [5, 5]
opening = true
opening_at = [5, 4.5]   # the half next to the marker

[[wall]]
key = "B3"
from = [0, 5]
to = [1, 5]
opening = true

[[wall]]
key = "B1"
from = [1, 5]
to = [2, 5]
opening = false

[[wall]]
key = "A1"
from = [2, 5]
to = [4, 5]
opening = true
opening_at = [3.5, 5]   # the half next to the marker

[[wall]]
key = "B4"
from = [4, 5]
to = [5, 5]
opening = false

[[objective]] # touches the right side of C4 at [1, 2] (109 + 22.5 + 20), centre on row 2
at_mm = [151.5, 206.0]

[[objective]]
at = [3.5, 3]

[[objective]] # touches the left side of C2 at [6, 4] (594 - 31 - 20), centre on row 4
at_mm = [543.0, 400.0]

[[teleporter]]
at = [5.5, 2.5]

[[teleporter]]
at = [1.5, 3.5]

[[zone]] # dark grey
name = "grey"
from = [0, 0]
to = [7, 1]

[[zone]] # dark orange
name = "orange"
from = [0, 5]
to = [7, 6]

# Light terrain C1..C5: footprint of the card symbol, sizes in [terrain] light_mm.
# long = the board axis of the long side (C1, C2). Measured on the card photo, then snapped (skill record-map, "Placement of objects").

[[light]] # left side on col 6 (594 + 31.5), bottom side on row 2 (206 - 40.5)
key = "C1"
at_mm = [625.5, 165.5]
long = "y"

[[light]]
key = "C2"
at = [6, 4]
long = "x"

[[light]] # left side on col 4 (400 + 24), centre on row 2
key = "C3"
at_mm = [424, 206]

[[light]]
key = "C4"
at = [1, 2]

[[light]] # right side on col 3 (303 - 20), centre on row 4
key = "C5"
at_mm = [283, 400]
