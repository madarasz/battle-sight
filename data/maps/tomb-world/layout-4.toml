# Tomb World layout card 4. Recorded from a photo of the card (skill record-map).
# key = wall label on the card (A = 2 grid, B = 1 grid). opening = true:
# a hexagon marker is next to the wall (breach point on A1 and B2, hatchway
# on the others). An opening sits at the centre between two pillars. On an A
# wall with a middle pillar, opening_at names the half next to the marker.
# Points: at = [col, row] = grid intersection (0..7, 0..6, steps of 0.5),
# or at_mm = [x, y] in board mm (origin top-left board corner).
schema = 1
name = "Layout 4"
terrain = "Tomb World"
source = "layout card 4, photo"

# A walls have a pillar at their middle too, but A2 has none.

pillars = [
    [0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [2, 2],
    [0, 3], [1, 3], [2, 3], [5, 3], [6, 3], [7, 3], [5, 4],
    [0, 5], [1, 5], [2, 5], [3, 5], [4, 5], [5, 5],
]
wall_ends = [[3, 3], [4, 3]]

[[wall]]
key = "B3"
from = [0, 1]
to = [1, 1]
opening = true

[[wall]]
key = "B1"
from = [1, 1]
to = [2, 1]
opening = false

[[wall]]
key = "B4"
from = [2, 1]
to = [3, 1]
opening = false

[[wall]]
key = "A3"
from = [3, 1]
to = [5, 1]
opening = true
opening_at = [3.5, 1]   # the half next to the marker

[[wall]]
key = "A4"
from = [2, 1]
to = [2, 3]
opening = true
opening_at = [2, 1.5]   # the half next to the marker

[[wall]]
key = "A2"
from = [5, 1]
to = [5, 3]
opening = false

[[wall]]
key = "A1"
from = [0, 3]
to = [2, 3]
opening = true
opening_at = [0.5, 3]   # the half next to the marker

[[wall]]
key = "B2"
from = [2, 3]
to = [3, 3]
opening = true

[[wall]]
key = "B2"
from = [4, 3]
to = [5, 3]
opening = true

[[wall]]
key = "A3"
from = [5, 3]
to = [7, 3]
opening = true
opening_at = [6.5, 3]   # the half next to the marker

[[wall]]
key = "A2"
from = [2, 3]
to = [2, 5]
opening = false

[[wall]]
key = "A4"
from = [5, 3]
to = [5, 5]
opening = true
opening_at = [5, 4.5]   # the half next to the marker

[[wall]]
key = "B3"
from = [0, 5]
to = [1, 5]
opening = true

[[wall]]
key = "B1"
from = [1, 5]
to = [2, 5]
opening = false

[[wall]]
key = "A1"
from = [2, 5]
to = [4, 5]
opening = true
opening_at = [3.5, 5]   # the half next to the marker

[[wall]]
key = "B4"
from = [4, 5]
to = [5, 5]
opening = false

[[objective]] # touches C4 on its right; off the half grid
at_mm = [149.0, 206.0]

[[objective]]
at = [3.5, 3]

[[objective]]
at = [5.5, 4]

[[teleporter]]
at = [5.5, 2.5]

[[teleporter]]
at = [1.5, 3.5]

[[zone]] # dark grey
name = "grey"
from = [0, 0]
to = [7, 1]

[[zone]] # dark orange
name = "orange"
from = [0, 5]
to = [7, 6]

# Light terrain C1..C5: footprint of the card symbol, sizes in [terrain] light_mm.
# long = the board axis of the long side (C1, C2). Centres measured on the card photo.

[[light]] # off the grid
key = "C1"
at_mm = [625, 167]
long = "y"

[[light]]
key = "C2"
at = [6, 4]
long = "x"

[[light]] # off the grid
key = "C3"
at_mm = [422, 207]

[[light]]
key = "C4"
at = [1, 2]

[[light]] # off the grid
key = "C5"
at_mm = [282, 403]
