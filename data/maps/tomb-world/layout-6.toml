# Tomb World layout card 6. Recorded from a photo of the card (skill record-map).
# key = wall label on the card (A = 2 grid, B = 1 grid). opening = true:
# a hexagon marker is next to the wall (breach point on A1 and B2, hatchway
# on the others). An opening sits at the centre between two pillars. On an A
# wall with a middle pillar, opening_at names the half next to the marker.
# Points: at = [col, row] = grid intersection (0..7, 0..6, steps of 0.5),
# or at_mm = [x, y] in board mm (origin top-left board corner).
schema = 1
name = "Layout 6"
terrain = "Tomb World"
source = "layout card 6, photo"

# A walls have a pillar at their middle too, but A2 has none.
pillars = [
    [0, 1], [1, 1], [3, 1], [4, 1], [5, 1], [6, 1], [7, 1],
    [3, 2], [1.5, 2], [1.5, 3],
    [3, 3], [4, 3], [5, 3],
    [0, 4], [1, 4], [2, 4], [3, 4], [5, 4],
    [3, 5], [5, 5], [6, 5], [7, 5],
]
wall_ends = [[6, 3]]

# Row 1 (top)
[[wall]]
key = "B3"
from = [0, 1]
to = [1, 1]
opening = true

[[wall]]
key = "A2"
from = [1, 1]
to = [3, 1]
opening = false

[[wall]]
key = "A1"
from = [3, 1]
to = [5, 1]
opening = true
opening_at = [4.5, 1]   # the half next to the marker

[[wall]]
key = "A4"
from = [5, 1]
to = [7, 1]
opening = true
opening_at = [6.5, 1]   # the half next to the marker

# Column 3
[[wall]]
key = "A1"
from = [3, 1]
to = [3, 3]
opening = true
opening_at = [3, 1.5]   # the half next to the marker

[[wall]]
key = "B2"
from = [3, 3]
to = [3, 4]
opening = true

[[wall]]
key = "B3"
from = [3, 4]
to = [3, 5]
opening = true

# Column 1.5
[[wall]]
key = "B4"
from = [1.5, 2]
to = [1.5, 3]
opening = false

# Row 3
[[wall]]
key = "B2"
from = [3, 3]
to = [4, 3]
opening = true

[[wall]]
key = "B4"
from = [4, 3]
to = [5, 3]
opening = false

[[wall]] # ends at the wall end
key = "B1"
from = [5, 3]
to = [6, 3]
opening = false

# Row 4
[[wall]]
key = "A4"
from = [0, 4]
to = [2, 4]
opening = true
opening_at = [1.5, 4]   # the half next to the marker

[[wall]]
key = "B1"
from = [2, 4]
to = [3, 4]
opening = false

# Column 5
[[wall]]
key = "A3"
from = [5, 3]
to = [5, 5]
opening = true
opening_at = [5, 3.5]   # the half next to the marker

# Row 5
[[wall]]
key = "A2"
from = [3, 5]
to = [5, 5]
opening = false

[[wall]]
key = "A3"
from = [5, 5]
to = [7, 5]
opening = true
opening_at = [6.5, 5]   # the half next to the marker

[[objective]]
at = [5, 2]

[[objective]] # left of C2 edge, on the mid line; off the half grid
at_mm = [81.0, 303.0]

[[objective]] # touches C5 on its left; off the grid
at_mm = [391.0, 406.0]

[[teleporter]]
at = [2, 2.5]

[[teleporter]]
at = [5.5, 4.5]

[[zone]] # dark grey
name = "grey"
from = [0, 0]
to = [7, 1]

[[zone]] # dark orange
name = "orange"
from = [0, 5]
to = [7, 6]
