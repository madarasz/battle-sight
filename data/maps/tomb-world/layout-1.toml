# Tomb World layout card 1. Recorded from a photo of the card (skill record-map).
# key = wall label on the card (A = 2 grid, B = 1 grid). opening = true:
# a hexagon marker is next to the wall (breach point on A1 and B2, hatchway
# on the others). An opening sits at the centre between two pillars. On an A
# wall with a middle pillar, opening_at names the half next to the marker.
# Points: at = [col, row] = grid intersection (0..7, 0..6, steps of 0.5),
# or at_mm = [x, y] in board mm (origin top-left board corner).
schema = 1
name = "Layout 1"
terrain = "Tomb World"
source = "layout card 1, photo"

# A walls have a pillar at their middle too, but A2 has none.

pillars = [
    [3, 0], [3, 1], [3, 2], [3, 3], [4, 0], [4, 1], [4, 2],
    [4, 3], [1, 3], [2, 3], [5, 3], [6, 3], [6, 2], [6, 4],
    [6, 5], [6, 6], [1, 4], [1, 5], [1, 6], [2.5, 5], [4.5, 5],
]
wall_ends = [[6, 1]]

[[wall]]
key = "B4"
from = [3, 0]
to = [3, 1]
opening = false

[[wall]]
key = "A3"
from = [3, 1]
to = [3, 3]
opening = true
opening_at = [3, 1.5]   # the half next to the marker

[[wall]]
key = "A1"
from = [4, 0]
to = [4, 2]
opening = true
opening_at = [4, 0.5]   # the half next to the marker

[[wall]]
key = "B2"
from = [4, 2]
to = [4, 3]
opening = true

[[wall]]
key = "B4"
from = [1, 3]
to = [2, 3]
opening = false

[[wall]]
key = "B3"
from = [2, 3]
to = [3, 3]
opening = true

[[wall]]
key = "A4"
from = [3, 3]
to = [5, 3]
opening = true
opening_at = [4.5, 3]   # the half next to the marker

[[wall]]
key = "B1"
from = [5, 3]
to = [6, 3]
opening = false

[[wall]]
key = "A3"
from = [6, 1]
to = [6, 3]
opening = true
opening_at = [6, 2.5]   # the half next to the marker

[[wall]]
key = "A1"
from = [6, 3]
to = [6, 5]
opening = true
opening_at = [6, 3.5]   # the half next to the marker

[[wall]]
key = "B3"
from = [6, 5]
to = [6, 6]
opening = true

[[wall]]
key = "B1"
from = [1, 3]
to = [1, 4]
opening = false

[[wall]]
key = "A4"
from = [1, 4]
to = [1, 6]
opening = true
opening_at = [1, 4.5]   # the half next to the marker

[[wall]]
key = "A2"
from = [2.5, 5]
to = [4.5, 5]
opening = false

[[objective]]
at = [2.5, 0.5]

[[objective]]
at = [4.5, 1.5]

[[objective]]
at = [3.5, 4]

[[teleporter]]
at = [3.5, 2.5]

[[teleporter]]
at = [3.5, 5.5]

[[zone]] # dark orange
name = "orange"
from = [0, 0]
to = [1, 6]

[[zone]] # dark grey
name = "grey"
from = [6, 0]
to = [7, 6]

# Light terrain C1..C5: footprint of the card symbol, sizes in [terrain] light_mm.
# long = the board axis of the long side (C1, C2). Centres measured on the card photo.

[[light]] # off the grid
key = "C1"
at_mm = [142, 170]
long = "y"

[[light]]
key = "C2"
at = [5, 4]
long = "y"

[[light]] # top 5 mm from the board edge; off the grid
key = "C3"
at_mm = [497, 29]

[[light]]
key = "C4"
at = [2, 4]

[[light]] # off the grid
key = "C5"
at_mm = [228, 133]
