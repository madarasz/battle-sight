# Tomb World layout card 3. Recorded from a photo of the card (skill record-map).
# key = wall label on the card (A = 2 grid, B = 1 grid). opening = true:
# a hexagon marker is next to the wall (breach point on A1 and B2, hatchway
# on the others). An opening sits at the centre between two pillars. On an A
# wall with a middle pillar, opening_at names the half next to the marker.
# Points: at = [col, row] = grid intersection (0..7, 0..6, steps of 0.5),
# or at_mm = [x, y] in board mm (origin top-left board corner).
schema = 1
name = "Layout 3"
terrain = "Tomb World"
source = "layout card 3, photo"

# A walls have a pillar at their middle too, but A2 has none.

pillars = [
    [2, 0], [2, 1], [2, 2], [1, 2], [3, 2], [5, 2], [6, 2],
    [6, 0], [6, 1], [1, 3], [1, 4], [1, 5], [1, 6], [2, 4],
    [4, 4], [5, 4], [5, 3], [5, 5], [5, 6], [3, 5], [4, 5],
]
wall_ends = [[3, 1], [4, 1]]

[[wall]]
key = "A3"
from = [2, 0]
to = [2, 2]
opening = true
opening_at = [2, 1.5]   # the half next to the marker

[[wall]]
key = "B1"
from = [3, 1]
to = [4, 1]
opening = false

[[wall]]
key = "B1"
from = [1, 2]
to = [2, 2]
opening = false

[[wall]]
key = "B2"
from = [2, 2]
to = [3, 2]
opening = true

[[wall]]
key = "A2"
from = [3, 2]
to = [5, 2]
opening = false

[[wall]]
key = "B3"
from = [5, 2]
to = [6, 2]
opening = true

[[wall]]
key = "A3"
from = [6, 0]
to = [6, 2]
opening = true
opening_at = [6, 0.5]   # the half next to the marker

[[wall]]
key = "A4"
from = [1, 2]
to = [1, 4]
opening = true
opening_at = [1, 2.5]   # the half next to the marker

[[wall]]
key = "A1"
from = [1, 4]
to = [1, 6]
opening = true
opening_at = [1, 5.5]   # the half next to the marker

[[wall]]
key = "B3"
from = [1, 4]
to = [2, 4]
opening = true

[[wall]]
key = "A2"
from = [2, 4]
to = [4, 4]
opening = false

[[wall]]
key = "B2"
from = [4, 4]
to = [5, 4]
opening = true

[[wall]]
key = "A1"
from = [5, 2]
to = [5, 4]
opening = true
opening_at = [5, 3.5]   # the half next to the marker

[[wall]]
key = "A4"
from = [5, 4]
to = [5, 6]
opening = true
opening_at = [5, 5.5]   # the half next to the marker

[[wall]]
key = "B4"
from = [3, 5]
to = [4, 5]
opening = false

[[objective]] # touches the wall end at [4, 1] (400 + 6.5 + 20), centre on row 1
at_mm = [426.5, 109.0]

[[objective]]
at = [3.5, 3]

[[objective]] # touches the pillar at [3, 5] (303 - 6.5 - 20), centre on row 5
at_mm = [276.5, 497.0]

[[teleporter]]
at = [2.5, 1]

[[teleporter]]
at = [4.5, 5]

[[zone]] # dark orange
name = "orange"
from = [0, 0]
to = [1, 6]

[[zone]] # dark grey
name = "grey"
from = [6, 0]
to = [7, 6]

# Light terrain C1..C5: footprint of the card symbol, sizes in [terrain] light_mm.
# long = the board axis of the long side (C1, C2). Measured on the card photo, then snapped (skill record-map, "Placement of objects").

[[light]]
key = "C1"
at = [5, 1]
long = "y"

[[light]] # left side on col 2 (206 + 23), centre on row 3
key = "C2"
at_mm = [229, 303]
long = "y"

[[light]] # left side on col 1 (109 + 24), bottom side on row 1 (109 - 24)
key = "C3"
at_mm = [133, 85]

[[light]]
key = "C4"
at = [6, 5]

[[light]]
key = "C5"
at = [2, 5]
